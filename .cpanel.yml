---
deployment:
  tasks:
    - export APPPATH=$HOME/fleet.kmmapps.com
    - cd $APPPATH && /usr/local/bin/composer install --no-dev --optimize-autoloader
    - cd $APPPATH && /usr/local/bin/php bin/console doctrine:migrations:migrate --no-interaction --env=prod
    - cd $APPPATH && /usr/local/bin/php bin/console cache:clear --env=prod
