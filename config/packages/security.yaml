security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\ActiveUserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 7776000
                path: /
                secure: auto
                httponly: true
                samesite: lax
                always_remember_me: true

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_COMPANY_ADMIN, ROLE_DRIVER]
        ROLE_COMPANY_ADMIN: [ROLE_DRIVER, ROLE_END_USER]

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: '^/activate/[a-f0-9]{64}$', roles: PUBLIC_ACCESS }
        - { path: ^/platform, roles: ROLE_SUPER_ADMIN }
        - { path: ^/notifications, roles: ROLE_COMPANY_ADMIN }
        - { path: ^/documents, roles: ROLE_COMPANY_ADMIN }
        - { path: ^/drivers, roles: ROLE_COMPANY_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
