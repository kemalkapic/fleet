parameters:
    app.mail_from: 'noreply@kmmapps.com'
    app.name: 'Vozi Miško'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $projectDir: '%kernel.project_dir%'
            string $appName: '%app.name%'
            string $mailFrom: '%app.mail_from%'

    App\Service\DocumentScan\DocumentDataExtractorInterface:
        alias: App\Service\DocumentScan\OpenRouterDocumentDataExtractor

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
